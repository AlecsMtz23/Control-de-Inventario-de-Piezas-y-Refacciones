{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}{{ 'Editar usuario' if u else 'Nuevo usuario' }}{% endblock %}
{% block content %}
<div class="page-head">
  <h1>{{ 'Editar usuario' if u else 'Nuevo usuario' }} <span>{{ u.usuario if u else '' }}</span></h1>
  <a class="btn" href="{{ url_for('usuarios') }}">← Volver</a>
</div>
<form class="card form-grid" method="post" autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Usuario<input name="usuario" value="{{ form.usuario or '' }}" required maxlength="30"></label>
  <label class="span-2">Nombre completo<input name="nombre" value="{{ form.nombre or '' }}" required maxlength="80"></label>
  <label>Rol
    <select name="rol" required>
      {% for r in ROLES %}<option {{ 'selected' if r == form.rol }}>{{ r }}</option>{% endfor %}
    </select>
  </label>
  <label>Contraseña{{ ' (dejar vacía para no cambiarla)' if u }}<input name="password" type="password" minlength="8" {{ '' if u else 'required' }} autocomplete="new-password"></label>
  <label class="check"><input type="checkbox" name="activo" {{ 'checked' if (form.activo if u else True) }}> Cuenta activa</label>
  <div class="span-3"><button class="btn primary">{{ icon('check', 16) }} Guardar usuario</button></div>
</form>
{% endblock %}
