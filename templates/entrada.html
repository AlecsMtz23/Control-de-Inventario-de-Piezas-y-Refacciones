{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Recibir inventario{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Recibir inventario <span>Movimiento de entrada</span></h1>
  <a class="btn" href="{{ url_for('movimientos') }}">Ver movimientos</a>
</div>
<form class="card form-grid" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label class="span-2">Pieza
    <select name="pieza_id" required>
      <option value="">Selecciona…</option>
      {% for p in piezas %}<option value="{{ p.id }}" {{ 'selected' if p.id == sel }}>{{ p.codigo }} · {{ p.nombre }} (existencia: {{ p.cantidad }})</option>{% endfor %}
    </select>
  </label>
  <label>Cantidad recibida<input name="cantidad" type="number" min="1" required></label>
  <label class="span-3">Referencia (factura, proveedor u orden de compra)<input name="referencia" maxlength="80" placeholder="Factura F-1029 · Rodamientos del Norte"></label>
  <div class="span-3"><button class="btn primary">{{ icon('inbox', 16) }} Registrar entrada</button></div>
</form>
{% endblock %}
